# Cổng vào duy nhất (host :6868).
#   /api/*  -> backend Laravel (php-fpm)
#   /auth/* -> Keycloak
#   /       -> giao diện web (frontend/dist)
# Link của hệ PHP cũ (index.php, dashboard.php...) được chuyển sang trang tương ứng của bản mới.
server {
    listen 80;
    server_name _;
    client_max_body_size 512m;
    # Chuyển hướng dùng đường dẫn tương đối (giữ nguyên host:port người dùng đang mở, vd :6868)
    absolute_redirect off;
    access_log /var/log/nginx/hdr.log hdrdebug;   # TẠM để debug header

    # ---- Backend API ----
    location ^~ /api/ {
        root /var/www/backend/public;
        try_files $uri @laravel;
    }
    location @laravel {
        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_read_timeout 600;
    }

    # ---- Keycloak ----
    location ^~ /auth/ {
        proxy_pass http://keycloak:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
    }

    # ---- Link của hệ PHP cũ -> trang tương ứng (302 để sau này đổi được) ----
    location = /index.php          { return 302 /form; }
    location = /process.php        { return 302 /form; }
    location = /dashboard.php      { return 302 /evaluations; }
    location = /unit_dashboard.php { return 302 /evaluations; }
    location = /view_file.php      { return 302 /evaluations; }
    location = /edit_file.php      { return 302 /evaluations; }
    location = /log_event.php      { return 204; }
    location ~ \.php$              { return 302 /; }   # login.php, register.php, logout.php...
    location ~ ^/(includes|data|results|uploads|logs)(/|$) { return 404; }

    # Link /app/... dùng trong giai đoạn chạy song song
    location = /app { return 302 /; }
    location ^~ /app/ {
        rewrite ^/app/(.*)$ /$1 redirect;
    }

    # ---- Giao diện web (Vue SPA) ----
    root /var/www/frontend;

    # sw.js dọn service worker của bản cũ: không cho trình duyệt giữ bản cũ
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # File build có mã băm trong tên -> cache lâu
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html luôn lấy bản mới nhất (để người dùng nhận bản cập nhật ngay)
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
