# Cổng vào duy nhất (host :6868).
#   /api/*  -> backend Laravel (php-fpm "app")
#   /auth/* -> Keycloak
#   /app/   -> giao diện mới (frontend SPA)
#   /       -> giao diện cũ (php-fpm "legacy") - TẠM THỜI, xoá khi giao diện mới hoàn tất
server {
    listen 80;
    server_name _;
    client_max_body_size 512m;

    # ---- Backend API ----
    location ^~ /api/ {
        root /var/www/backend/public;
        try_files $uri @laravel;
    }
    location @laravel {
        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_read_timeout 600;
    }

    # ---- Keycloak ----
    location ^~ /auth/ {
        proxy_pass http://keycloak:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
    }

    # ---- Giao diện mới ----
    location ^~ /app/ {
        alias /var/www/frontend/;
        try_files $uri $uri/ /app/index.html;
    }

    # ---- Giao diện cũ (tạm thời) ----
    # Không cho tải trực tiếp dữ liệu/thư viện qua URL (chỉ truy cập qua các trang PHP có kiểm tra quyền)
    location ~ ^/(includes|data|results|uploads|logs)(/|$) { return 404; }
    location ~ ^/(README\.md|php\.ini|criteria\.json)$     { return 404; }

    location / {
        root /var/www/legacy;
        index index.php;
        try_files $uri $uri/ =404;
    }
    location ~ \.php$ {
        root /var/www/legacy;
        try_files $uri =404;
        fastcgi_pass legacy:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 600;
    }
}
