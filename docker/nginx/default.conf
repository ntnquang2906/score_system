# Cổng vào duy nhất (host :6868).
#   /api/*  -> backend Laravel (php-fpm)
#   /auth/* -> Keycloak
#   /       -> giao diện web (frontend/dist)
#
# Truy cập:
#   http://192.168.88.13:6868         mạng nội bộ (HTTP được phép vì là IP nội bộ)
#   https://scoring.datasphere.id.vn   công khai, Cloudflare giữ HTTPS rồi chuyển vào đây bằng HTTP
#   http://*.sn.mynetname.net:6868     công khai nhưng không có HTTPS -> chuyển sang link HTTPS ở trên

# Giữ nguyên giao thức gốc do proxy phía trước (Cloudflare) báo, nếu không có thì dùng giao thức của kết nối
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name *.sn.mynetname.net;
    return 301 https://scoring.datasphere.id.vn$request_uri;
}

server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 512m;
    # Chuyển hướng dùng đường dẫn tương đối (giữ nguyên host:port người dùng đang mở)
    absolute_redirect off;

    # ---- Backend API ----
    location ^~ /api/ {
        root /var/www/backend/public;
        try_files $uri @laravel;
    }
    location @laravel {
        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_read_timeout 600;
    }

    # ---- Keycloak ----
    location ^~ /auth/ {
        proxy_pass http://keycloak:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
    }

    # Link cũ của hệ PHP (index.php, dashboard.php...) -> trang chủ
    location ~ \.php$ { return 302 /; }

    # ---- Giao diện web (Vue SPA) ----
    root /var/www/frontend;

    # sw.js dọn service worker của bản cũ: không cho trình duyệt giữ bản cũ
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # File build có mã băm trong tên -> cache lâu
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html luôn lấy bản mới nhất (để người dùng nhận bản cập nhật ngay)
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
