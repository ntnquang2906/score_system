# Stack dev/staging. Chạy: docker compose up -d --build
x-php: &php
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    args:
      UID: ${UID:-1000}
      GID: ${GID:-1000}
  image: score-php:dev
  env_file: backend/.env
  environment:
    TEMP_ACCOUNTS_CLIENT_SECRET: ${TEMP_ACCOUNTS_CLIENT_SECRET:-}   # tạm thời khi chưa có SSO
  volumes:
    - ./backend:/var/www/backend
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_started }
  restart: unless-stopped

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${NGINX_PORT:-6868}:80"
    volumes:
      - ./docker/nginx:/etc/nginx/conf.d:ro
      - ./backend:/var/www/backend:ro
      - ./frontend/dist:/var/www/frontend:ro
    depends_on: [app, keycloak]
    restart: unless-stopped

  app:
    <<: *php

  # Việc chạy nền: đọc tệp minh chứng (hàng đợi evidence, mỗi job tới 15 phút), rồi tới hàng đợi chung
  queue:
    <<: *php
    command: php artisan queue:work --queue=evidence,default --tries=2 --timeout=900 --max-time=3600

  # Dịch vụ đọc tệp minh chứng (OCR tiếng Việt, tìm con dấu/chữ ký). Chỉ mở trong mạng nội bộ docker.
  # Giới hạn CPU vì server dùng chung với nhóm khác.
  evidence-ai:
    build: ./docker/evidence-ai
    image: score-evidence-ai:dev
    environment:
      VLM_URL: ${VLM_URL:-}                     # trống => chỉ OCR + xử lý ảnh; có GPU: http://vlm:11434
      VLM_MODEL: ${VLM_MODEL:-qwen2.5vl:7b}
    cpus: 2
    mem_limit: 2g
    restart: unless-stopped

  # Mô hình AI đọc ảnh minh chứng (Ollama), cần GPU NVIDIA đã cài driver. Mặc định KHÔNG chạy, bật bằng:
  #   docker compose --profile gpu up -d vlm && docker compose exec vlm ollama pull qwen2.5vl:7b
  #   rồi đặt VLM_URL=http://vlm:11434 trong .env và docker compose up -d evidence-ai
  vlm:
    image: ollama/ollama:0.12.6
    profiles: [gpu]
    environment:
      OLLAMA_KEEP_ALIVE: 30m                    # rảnh 30 phút thì trả bộ nhớ GPU (card dùng chung với nhóm khác)
      OLLAMA_NUM_PARALLEL: 1
    volumes:
      - vlmdata:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: score
      POSTGRES_USER: score
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-score}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/01-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5442}:5432"   # chỉ mở cho máy local (DBeaver/psql)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U score -d score"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    restart: unless-stopped

  # Kho file tương thích S3 (file minh chứng, file xuất Excel).
  # Production có thể thay bằng S3 của nhà cung cấp cloud trong nước, chỉ đổi biến AWS_* trong backend/.env
  seaweedfs:
    image: chrislusf/seaweedfs:3.97
    command: server -dir=/data -s3 -s3.config=/etc/seaweedfs/s3.json -volume.max=0
    volumes:
      - s3data:/data
      - ./docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    restart: unless-stopped

  s3-init:   # tạo bucket 1 lần rồi thoát
    image: chrislusf/seaweedfs:3.97
    depends_on: [seaweedfs]
    entrypoint: >
      /bin/sh -c "
      until echo 's3.bucket.list' | weed shell -master=seaweedfs:9333 -filer=seaweedfs:8888 2>&1 | grep -qv error; do sleep 2; done;
      echo 's3.bucket.list' | weed shell -master=seaweedfs:9333 -filer=seaweedfs:8888 | grep -q score-files
      || echo 's3.bucket.create -name score-files' | weed shell -master=seaweedfs:9333 -filer=seaweedfs:8888;
      echo 's3.bucket.list' | weed shell -master=seaweedfs:9333 -filer=seaweedfs:8888
      "
    restart: "no"

  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: score
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-score}
      KC_HTTP_RELATIVE_PATH: /auth
      # Không cố định hostname: Keycloak lấy theo link người dùng đang mở (LAN hoặc domain HTTPS).
      # Mỗi link cho ra 1 issuer riêng -> liệt kê đủ trong OIDC_ISSUER của backend/.env
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY_HEADERS: xforwarded
      TEMP_ACCOUNTS_CLIENT_SECRET: ${TEMP_ACCOUNTS_CLIENT_SECRET:-}   # dùng trong realm-score.json khi import lần đầu
      KC_HTTP_ENABLED: "true"
    volumes:
      - ./docker/keycloak/import:/opt/keycloak/data/import:ro
      - ./docker/keycloak/themes/score:/opt/keycloak/themes/score:ro   # giao diện đăng nhập riêng
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

volumes:
  vlmdata:
  pgdata:
  redisdata:
  s3data:
